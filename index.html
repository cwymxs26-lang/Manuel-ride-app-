<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzGxcMpExaBrX6SN65OPAbJyaf4FxNUdKjSXxPwvZ6t9xoCrw-pOhxb3AToNt4k1yiS/exec';
    const form = document.getElementById('formViaje');
    const origenInput = document.getElementById('origenText');

    // 1. Obtener GPS al cargar
    window.onload = function() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                document.getElementById('lat').value = position.coords.latitude;
                document.getElementById('lng').value = position.coords.longitude;
                origenInput.value = "Ubicación GPS detectada ✅";
            });
        }
    };

    // 2. ENVIAR DATOS (Corregido para evitar pantalla en blanco)
    form.addEventListener('submit', e => {
        e.preventDefault(); // <--- ESTO ES VITAL: Detiene la recarga de página
        
        cambiarVista('vista-procesando');

        // Usamos fetch de una forma que Google Apps Script acepta sin errores de CORS
        fetch(scriptURL, { 
            method: 'POST', 
            body: new FormData(form),
            mode: 'no-cors' // <--- Añade esto para evitar bloqueos del navegador
        })
        .then(() => {
            // Con 'no-cors' Google no responde un mensaje claro, 
            // así que después de enviar, esperamos 1.5 segundos y mostramos éxito
            setTimeout(() => {
                cambiarVista('vista-exito');
                form.reset();
            }, 1500);
        })
        .catch(error => {
            console.error('Error!', error.message);
            alert('Error al enviar. Verifica tu conexión.');
            cambiarVista('vista-solicitud');
        });
    });

    function cambiarVista(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
</script>
